<!doctype html><html lang="cs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"></head><body><title>Batole vs Mikrovlnky</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&display=swap">
<style>
  /* Single-look game page: dark nursery-night frame around a warm living room canvas */
  :root {
    --bg: #1f1a24;
    --frame: #2d2533;
    --ink: #fff4e3;
    --muted: #c9b9a8;
    --accent: #ffbf3c;
    --gold: #ffd23f;
    --row: #3a3042;
    --line: #4a3f53;
    --font-display: 'Baloo 2', 'Trebuchet MS', system-ui, sans-serif;
    color-scheme: dark;
  }
  html, body { min-height: 100%; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font-display);
    margin: 0;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: 16px;
    box-sizing: border-box;
  }
  #app {
    display: grid; gap: 18px; align-items: start;
    grid-template-columns: minmax(0, 1fr) 300px;
    max-width: 1620px; margin: 0 auto;
  }
  @media (max-width: 960px) { #app { grid-template-columns: minmax(0, 1fr); } }
  #game {
    width: 100%; aspect-ratio: 1280 / 600; max-width: 100%;
    user-select: none; -webkit-user-select: none;
  }
  #game canvas { border-radius: 14px; box-shadow: 0 0 0 4px var(--frame), 0 20px 60px rgba(0,0,0,.5); touch-action: none; }
  #loading { position: fixed; inset: 0; display: grid; place-items: center; font-size: 22px; color: var(--muted); }

  #board {
    background: var(--frame); border-radius: 14px; padding: 18px 18px 16px;
    display: flex; flex-direction: column; gap: 14px; min-width: 0;
  }
  #board h2 { margin: 0; font-size: 26px; font-weight: 800; line-height: 1.1; color: var(--accent); }
  #board .sub { margin: -8px 0 0; font-size: 14px; color: var(--muted); line-height: 1.35; }
  #list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; counter-reset: r; }
  #list li {
    display: grid; grid-template-columns: 28px minmax(0, 1fr) auto; gap: 8px; align-items: baseline;
    padding: 6px 10px; border-radius: 8px; font-size: 18px; font-weight: 600;
    background: var(--row);
  }
  #list li .r { color: var(--muted); font-variant-numeric: tabular-nums; }
  #list li .n { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #list li .s { font-weight: 800; font-variant-numeric: tabular-nums; }
  #list li.top1 .r { color: var(--gold); }
  #list li.me { outline: 2px solid var(--accent); }
  #list .empty { color: var(--muted); font-size: 15px; background: none; display: block; padding: 4px 0; }
  #nameForm { display: flex; flex-direction: column; gap: 6px; }
  #nameForm label { font-size: 14px; color: var(--muted); }
  #nameForm .row { display: flex; gap: 8px; }
  #nameInput {
    width: 100%; box-sizing: border-box; font-size: 20px !important; padding: 10px 12px !important;
    flex: 1; min-width: 0; font: 600 17px var(--font-display); color: var(--ink);
    background: var(--bg); border: 2px solid var(--line); border-radius: 8px; padding: 6px 10px;
  }
  #nameInput:focus-visible, #nameForm button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  #nameForm button {
    font: 800 16px var(--font-display); background: var(--accent); color: var(--bg);
    border: 0; border-radius: 8px; padding: 6px 14px; cursor: pointer;
  }
  [hidden] { display: none !important; }
  #who { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; font-size: 16px; color: var(--muted); }
  #who b { color: var(--ink); font-size: 18px; }
  #who button, #nameModal button {
    font: 800 15px var(--font-display); background: var(--accent); color: var(--bg);
    border: 0; border-radius: 8px; padding: 4px 12px; cursor: pointer;
  }
  #nameModal {
    position: fixed; inset: 0; z-index: 50; display: grid; place-items: center;
    background: rgba(20, 14, 26, .78); backdrop-filter: blur(4px);
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  #nameModal form {
    width: min(420px, 100%); box-sizing: border-box; background: var(--frame); border-radius: 16px;
    padding: 24px; display: flex; flex-direction: column; gap: 12px; box-shadow: 0 20px 60px rgba(0,0,0,.5);
  }
  #nameModal h2 { margin: 0; font-size: 34px; line-height: 1.05; color: var(--accent); }
  #nameModal p { margin: 0; color: var(--muted); font-size: 15px; line-height: 1.4; }
  #nameModal button { font-size: 20px; padding: 10px 14px; }
  #nameModal button:focus-visible, #who button:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
  #status { font-size: 13px; color: var(--muted); min-height: 1em; margin: 0; }
</style>

<div id="loading">Načítám…</div>
<div id="nameModal" role="dialog" aria-modal="true" aria-labelledby="nmTitle">
  <form id="nameForm">
    <h2 id="nmTitle">Kdo hraje?</h2>
    <p>Jméno se ukáže v žebříčku. Tohle zařízení si tě pamatuje, takže tam budeš jen jednou.</p>
    <input id="nameInput" maxlength="20" autocomplete="nickname" placeholder="např. Rychlé mimčo" required>
    <button type="submit">Hrát</button>
  </form>
</div>
<div id="app">
  <div id="game"></div>
  <aside id="board" aria-label="Žebříček">
    <h2>Žebříček</h2>
    <p class="sub">Nejlepší skóre každého hráče. Z jednoho zařízení je v žebříčku vždy jen jeden řádek.</p>
    <ol id="list"><li class="empty">Načítám žebříček…</li></ol>
    <div id="who">Hraje: <b id="whoName">–</b> <button type="button" id="changeName">Změnit</button></div>
    <p id="status"></p>
  </aside>
</div>

// ---------- zvuk (Web Audio) ----------
const Audio = {
  ctx: null, buffers: {}, crySrc: null,
  async init() {
    try {
      this.ctx = new (window.AudioContext || window.webkitAudioContext)();
      await Promise.all(Object.entries(SOUNDS).map(async ([k, uri]) => {
        const bin = atob(uri.split(',')[1]);
        const arr = new Uint8Array(bin.length);
        for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
        this.buffers[k] = await new Promise((res, rej) => this.ctx.decodeAudioData(arr.buffer, res, rej));
      }));
    } catch (e) { console.warn('audio off', e); }
  },
  unlock() { if (this.ctx && this.ctx.state !== 'running') this.ctx.resume(); },
  play(k, vol = 1, rate = 1) {
    if (!this.ctx || !this.buffers[k]) return null;
    const src = this.ctx.createBufferSource();
    src.buffer = this.buffers[k];
    src.playbackRate.value = rate;
    const g = this.ctx.createGain(); g.gain.value = vol;
    src.connect(g).connect(this.ctx.destination);
    src.start();
    return src;
  },
  stopCry() { try { this.crySrc && this.crySrc.stop(); } catch (e) {} this.crySrc = null; }
};

function loadImg(uri) {
  return new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = uri; });
}

const GRAVITY = 2600;        // px/s^2
const JUMP_V = -1000;
const JUMP_V2 = -900;
const START_SPEED = 330;     // px/s
const MAX_SPEED = 800;

let best = 0;
try { best = +localStorage.getItem('batole_best') || 0; } catch (e) {}

class Play extends Phaser.Scene {
  constructor() { super('play'); }

  create() {
    // pozadí
    this.room = this.add.tileSprite(0, 0, W, 450, 'room').setOrigin(0, 0);
    this.floor = this.add.tileSprite(0, FLOOR_TOP, W, H - FLOOR_TOP, 'floor').setOrigin(0, 0);
    const g = this.add.graphics();
    g.fillGradientStyle(0x2a1a10, 0x2a1a10, 0x2a1a10, 0x2a1a10, 0.35, 0.35, 0, 0);
    g.fillRect(0, FLOOR_TOP, W, 26);                    // stin pod listou
    // koberec v dráze
    this.rugY = GROUND - 6;

    // vrstvy
    this.shadows = this.add.layer();
    this.obsLayer = this.add.layer();
    this.babyLayer = this.add.layer();

    // batole
    const tex = this.textures.get('baby').getSourceImage();
    this.babyScale = BABY_H / tex.height;
    this.babyShadow = this.add.ellipse(BABY_X, GROUND + 2, 80, 16, 0x2a1a10, 0.35);
    this.shadows.add(this.babyShadow);
    this.baby = this.add.image(BABY_X, GROUND, 'baby').setOrigin(0.5, 1).setScale(this.babyScale);
    this.babyLayer.add(this.baby);

    // popředí (hračky, rozmazané)
    this.fg = this.add.tileSprite(0, H - 130, W, 130, 'fg').setOrigin(0, 0).setAlpha(0.95);

    // vinětace + teplé světlo
    const v = this.add.graphics();
    v.fillGradientStyle(0x000000, 0x000000, 0x000000, 0x000000, 0.0, 0.0, 0.25, 0.25);
    v.fillRect(0, H - 120, W, 120);
    v.fillGradientStyle(0xffc070, 0xffc070, 0xffc070, 0xffc070, 0.10, 0.10, 0, 0);
    v.fillRect(0, 0, W, 200);

    // částice
    this.add.graphics().fillStyle(0xffffff).fillCircle(8, 8, 8).generateTexture('dot', 16, 16).destroy();
    const tg = this.add.graphics();
    tg.fillStyle(0x7cc7ff).fillCircle(8, 12, 7).fillTriangle(1, 10, 15, 10, 8, 0);
    tg.generateTexture('tear', 16, 20); tg.destroy();
    this.dust = this.add.particles(0, 0, 'dot', {
      speed: { min: 40, max: 140 }, angle: { min: 180, max: 360 }, scale: { start: 0.9, end: 0 },
      alpha: { start: 0.55, end: 0 }, lifespan: 450, tint: 0xe9d6bd, gravityY: 200, emitting: false
    });
    this.babyLayer.add(this.dust);
    this.tears = this.add.particles(0, 0, 'tear', {
      speed: { min: 180, max: 320 }, angle: { min: 200, max: 340 }, scale: { start: 1, end: 0.6 },
      lifespan: 900, gravityY: 900, emitting: false
    });
    this.babyLayer.add(this.tears);
    this.stars = this.add.particles(0, 0, 'dot', {
      speed: { min: 200, max: 420 }, scale: { start: 0.8, end: 0 }, lifespan: 600,
      tint: [0xffd23f, 0xffffff, 0xff8a65], emitting: false
    });
    this.babyLayer.add(this.stars);

    // HUD
    const style = { fontFamily: "'Baloo 2', 'Trebuchet MS', sans-serif", fontSize: '40px', fontStyle: '800', color: '#fff4e3', stroke: '#3a2618', strokeThickness: 8 };
    this.scoreText = this.add.text(W / 2, 22, '0', { ...style, fontSize: '52px', strokeThickness: 10 }).setOrigin(0.5, 0).setDepth(10);
    this.bestText = this.add.text(W / 2, 86, '', { ...style, fontSize: '22px', strokeThickness: 6, color: '#ffd27a' }).setOrigin(0.5, 0).setDepth(10);

    // overlay: start / game over
    this.dim = this.add.rectangle(0, 0, W, H, 0x1a1020, 1).setOrigin(0).setDepth(20).setAlpha(0);
    this.flash = this.add.rectangle(0, 0, W, H, 0xff2a2a, 1).setOrigin(0).setDepth(21).setAlpha(0);
    this.wasted = this.add.image(W / 2, H / 2 - 20, 'wasted').setDepth(22).setVisible(false);
    this.title = this.add.text(W / 2, 170, 'Batole vs Mikrovlnky', { ...style, fontSize: '76px', strokeThickness: 12 }).setOrigin(0.5).setDepth(23);
    this.hint = this.add.text(W / 2, 260, 'Mezerník / klik / tap = skok   ·   2× = dvojskok', { ...style, fontSize: '28px', strokeThickness: 6 }).setOrigin(0.5).setDepth(23);
    this.tweens.add({ targets: this.hint, alpha: 0.45, yoyo: true, repeat: -1, duration: 700 });
    this.restart = this.add.text(W / 2, H - 52, 'Klikni nebo mezerník pro novou hru', { ...style, fontSize: '30px', strokeThickness: 7 }).setOrigin(0.5).setDepth(23).setVisible(false);

    // pauza
    this.pauseBtn = this.add.container(52, 52).setDepth(30).setVisible(false);
    const pbg = this.add.circle(0, 0, 32, 0x2d2533, 0.85).setStrokeStyle(4, 0xfff4e3);
    this.pauseIcon = this.add.graphics();
    this.pauseBtn.add([pbg, this.pauseIcon]);
    this.pauseBtn.setSize(72, 72).setInteractive({ useHandCursor: true });
    this.pauseBtn.on('pointerdown', () => this.togglePause());
    this.drawPauseIcon(false);
    this.pauseText = this.add.text(W / 2, H / 2 - 20, 'Pauza', { ...style, fontSize: '96px', strokeThickness: 14 }).setOrigin(0.5).setDepth(24).setVisible(false);
    this.pauseHint = this.add.text(W / 2, H / 2 + 60, 'Klikni nebo zmáčkni P pro pokračování', { ...style, fontSize: '28px', strokeThickness: 6 }).setOrigin(0.5).setDepth(24).setVisible(false);
    this.input.keyboard.on('keydown-P', () => this.togglePause());
    this.input.keyboard.on('keydown-ESC', () => this.togglePause());
    document.addEventListener('visibilitychange', () => { if (document.hidden && this.state === 'run') this.togglePause(); });

    // vstup
    this.input.on('pointerdown', (p, over) => {
      if (over && over.includes(this.pauseBtn)) return;
      if (this.state === 'paused') { this.togglePause(); return; }
      this.press();
    });
    this.input.keyboard.on('keydown-SPACE', (e) => {
      const t = document.activeElement && document.activeElement.tagName;
      if (t === 'INPUT' || t === 'BUTTON') return;
      e.preventDefault?.(); this.press();
    });
    this.input.keyboard.on('keydown-UP', () => this.press());

    this.state = 'menu';
    this.resetWorld();
    this.updateBest();
  }

  resetWorld() {
    this.obstacles?.forEach(o => { o.img.destroy(); o.sh.destroy(); });
    this.obstacles = [];
    this.speed = START_SPEED;
    this.score = 0;
    this.vy = 0; this.y = GROUND; this.jumps = 0; this.onGround = true;
    this.spawnIn = 1.2;
    this.runT = 0;
    this.baby.setAngle(0).setPosition(BABY_X, GROUND).setScale(this.babyScale);
    this.scoreText.setText('0');
  }

  drawPauseIcon(paused) {
    const g = this.pauseIcon; g.clear(); g.fillStyle(0xfff4e3);
    if (paused) g.fillTriangle(-9, -14, -9, 14, 14, 0);
    else { g.fillRoundedRect(-12, -13, 8, 26, 2); g.fillRoundedRect(4, -13, 8, 26, 2); }
  }

  togglePause() {
    if (this.state === 'run') {
      this.state = 'paused';
      this.tweens.pauseAll(); this.time.paused = true;
      this.dim.setAlpha(0.5);
      this.pauseText.setVisible(true); this.pauseHint.setVisible(true);
      this.drawPauseIcon(true);
    } else if (this.state === 'paused') {
      this.state = 'run';
      this.tweens.resumeAll(); this.time.paused = false;
      this.dim.setAlpha(0);
      this.pauseText.setVisible(false); this.pauseHint.setVisible(false);
      this.drawPauseIcon(false);
    }
  }

  updateBest() { this.bestText.setText(best ? 'Rekord ' + best : ''); }

  press() {
    if (!Board.named) return;
    Audio.unlock();
    if (this.state === 'paused') { this.togglePause(); return; }
    if (this.state === 'menu') { this.startRun(); this.jump(); return; }
    if (this.state === 'over') { if (this.overT > 0.8) { this.startRun(); } return; }
    this.jump();
  }

  startRun() {
        Audio.stopCry();
    this.resetWorld();
    this.state = 'run';
    this.tweens.killTweensOf([this.dim, this.title, this.wasted, this.restart]);
    this.dim.setAlpha(0); this.flash.setAlpha(0);
    this.title.setVisible(false); this.hint.setVisible(false);
    this.wasted.setVisible(false); this.restart.setVisible(false);
    this.pauseBtn.setVisible(true);
  }

  jump() {
    if (this.jumps >= 2) return;
    const first = this.jumps === 0;
    this.vy = first ? JUMP_V : JUMP_V2;
    this.jumps++;
    this.onGround = false;
    Audio.play(first ? 'boing1' : 'boing2', 0.8, 0.95 + Math.random() * 0.1);
    // squash & stretch
    const s = this.babyScale;
    this.baby.setScale(s * 0.85, s * 1.18);
    this.tweens.add({ targets: this.baby, scaleX: s, scaleY: s, duration: 260, ease: 'Back.Out' });
    if (first) this.dust.explode(10, BABY_X, GROUND);
    else this.dust.explode(8, BABY_X, this.y);
  }

  spawn() {
    const h = Phaser.Math.Between(78, 104);
    const tex = this.textures.get('micro').getSourceImage();
    const sc = h / tex.height;
    const w = tex.width * sc;
    const img = this.add.image(W + w, GROUND + 4, 'micro').setOrigin(0, 1).setScale(sc);
    const sh = this.add.ellipse(W + w + w / 2, GROUND + 4, w * 1.05, 16, 0x2a1a10, 0.35);
    this.obsLayer.add(img); this.shadows.add(sh);
    this.obstacles.push({ img, sh, w, h, x: W + w });
  }

  crash() {
    this.state = 'over';
    this.pauseBtn.setVisible(false);
    this.overT = 0;
    Audio.crySrc = Audio.play('cry', 1);
    this.cameras.main.shake(380, 0.014);
    this.flash.setAlpha(0.45);
    this.tweens.add({ targets: this.flash, alpha: 0, duration: 420 });
    this.stars.explode(24, BABY_X + 40, this.y - BABY_H * 0.6);
    this.tears.explode(10, BABY_X + 30, this.y - BABY_H * 0.75);
    this.time.delayedCall(300, () => this.state === 'over' && this.tears.explode(8, BABY_X + 30, GROUND - 60));
    this.time.delayedCall(700, () => this.state === 'over' && this.tears.explode(8, BABY_X + 30, GROUND - 60));
    // pád batolete
    this.tweens.add({ targets: this.baby, angle: 78, x: BABY_X - 20, y: GROUND + 6, duration: 420, ease: 'Bounce.Out' });
    const final = Math.floor(this.score);
    if (final > best) { best = final; try { localStorage.setItem('batole_best', best); } catch (e) {} }
    this.updateBest();
    Board.submit(final);
    // WASTED
    this.time.delayedCall(550, () => {
      if (this.state !== 'over') return;
      const img = this.textures.get('wasted').getSourceImage();
      const target = (H * 0.82) / img.height;
      this.wasted.setVisible(true).setAlpha(0).setScale(target * 0.6);
      this.tweens.add({ targets: this.dim, alpha: 0.55, duration: 400 });
      this.tweens.add({ targets: this.wasted, alpha: 1, scale: target, duration: 500, ease: 'Back.Out' });
      this.restart.setText('Skóre ' + final + '   ·   klikni nebo mezerník pro novou hru').setVisible(true).setAlpha(0);
      this.tweens.add({ targets: this.restart, alpha: 1, duration: 400, delay: 300 });
    });
  }

  update(time, deltaMs) {
    const dt = Math.min(deltaMs / 1000, 1 / 30);
    const moving = this.state === 'run' || this.state === 'menu';
    const sp = this.state === 'menu' ? 160 : this.speed;

    if (moving) {
      this.room.tilePositionX += sp * 0.45 * dt;
      this.floor.tilePositionX += sp * dt;
      this.fg.tilePositionX += sp * 1.35 * dt;
    }

    if (this.state === 'paused') return;
    if (this.state === 'over') { this.overT += dt; return; }

    // batole fyzika
    if (!this.onGround) {
      this.vy += GRAVITY * dt;
      this.y += this.vy * dt;
      if (this.y >= GROUND) {
        this.y = GROUND; this.vy = 0; this.jumps = 0; this.onGround = true;
        const s = this.babyScale;
        this.baby.setScale(s * 1.15, s * 0.85);
        this.tweens.add({ targets: this.baby, scaleX: s, scaleY: s, duration: 220, ease: 'Back.Out' });
        this.dust.explode(8, BABY_X, GROUND);
      }
    }
    this.runT += dt;
    const bob = this.onGround ? Math.abs(Math.sin(this.runT * 14)) * 5 : 0;
    this.baby.y = this.y - bob;
    this.baby.angle = this.onGround ? Math.sin(this.runT * 14) * 3 : Phaser.Math.Clamp(this.vy / 120, -8, 10);
    const air = (GROUND - this.y) / 300;
    this.babyShadow.setScale(Math.max(0.35, 1 - air), Math.max(0.35, 1 - air)).setAlpha(0.35 * Math.max(0.3, 1 - air));

    if (this.state !== 'run') return;

    // skóre + zrychlování
    this.score += dt * 10 * (this.speed / START_SPEED);
    this.speed = Math.min(START_SPEED + this.score * 1.2, MAX_SPEED);
    this.scoreText.setText(Math.floor(this.score));

    // překážky
    this.spawnIn -= dt;
    if (this.spawnIn <= 0) {
      this.spawn();
      const minGap = Phaser.Math.Clamp(1.35 - this.speed / 1400, 0.8, 1.2);
      this.spawnIn = minGap + Math.random() * 1.0;
    }
    const bw = this.baby.displayWidth, bh = this.baby.displayHeight;
    const bx = BABY_X - bw / 2 + bw * 0.18, by = this.y - bh + bh * 0.2;
    const bW = bw * 0.62, bH = bh * 0.75;
    for (const o of this.obstacles) {
      o.x -= this.speed * dt;
      o.img.x = o.x; o.sh.x = o.x + o.w / 2;
      const ox = o.x + o.w * 0.06, oy = GROUND + 4 - o.h * 0.92, oW = o.w * 0.88, oH = o.h;
      if (bx < ox + oW && bx + bW > ox && by < oy + oH && by + bH > oy) { this.crash(); return; }
    }
    this.obstacles = this.obstacles.filter(o => {
      if (o.x + o.w < -20) { o.img.destroy(); o.sh.destroy(); return false; }
      return true;
    });
  }
}


// ---------- žebříček (Firebase Firestore přes REST) ----------
const Board = {
  me: null, myName: '', myBest: 0, named: false, online: false, hasDoc: false,
  listEl: document.getElementById('list'),
  statusEl: document.getElementById('status'),
  modal: document.getElementById('nameModal'),
  formEl: document.getElementById('nameForm'),
  inputEl: document.getElementById('nameInput'),
  whoEl: document.getElementById('whoName'),
  status(t) { this.statusEl.textContent = t || ''; },
  ls(k, v) { try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch (e) { return null; } },
  url(path, extra = '') {
    return `https://firestore.googleapis.com/v1/projects/${encodeURIComponent(FIREBASE.projectId)}/databases/(default)/documents${path}?key=${encodeURIComponent(FIREBASE.apiKey)}${extra}`;
  },
  empty(msg) {
    this.listEl.textContent = '';
    const li = document.createElement('li'); li.className = 'empty'; li.textContent = msg; this.listEl.append(li);
  },
  render(rows) {
    if (!rows.length) { this.empty('Zatím nikdo. Buď první!'); return; }
    this.listEl.textContent = '';
    rows.forEach((r, i) => {
      const li = document.createElement('li');
      if (i === 0) li.classList.add('top1');
      if (r.id === this.me) li.classList.add('me');
      const a = document.createElement('span'); a.className = 'r'; a.textContent = (i + 1) + '.';
      const b = document.createElement('span'); b.className = 'n'; b.textContent = r.name || 'Anonymní mimčo';
      const c = document.createElement('span'); c.className = 's'; c.textContent = r.best;
      li.append(a, b, c); this.listEl.append(li);
    });
  },
  async refresh() {
    if (!this.online) return;
    try {
      const r = await fetch(this.url(':runQuery'), {
        method: 'POST', headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ structuredQuery: {
          from: [{ collectionId: 'scores' }],
          orderBy: [{ field: { fieldPath: 'best' }, direction: 'DESCENDING' }],
          limit: 15 } })
      });
      if (!r.ok) throw new Error(r.status);
      const rows = (await r.json()).filter(x => x.document).map(x => ({
        id: x.document.name.split('/').pop(),
        name: x.document.fields?.name?.stringValue || '',
        best: +(x.document.fields?.best?.integerValue || 0)
      }));
      this.render(rows);
    } catch (e) { this.empty('Žebříček teď nejde načíst.'); }
  },
  async loadMine() {
    try {
      const r = await fetch(this.url('/scores/' + this.me));
      if (r.status === 404) return;
      if (!r.ok) return;
      const d = await r.json();
      this.hasDoc = true;
      const sb = +(d.fields?.best?.integerValue || 0);
      if (sb > this.myBest) { this.myBest = sb; this.ls('batole_best', sb); best = Math.max(best, sb); window.game?.scene?.getScene('play')?.updateBest?.(); }
      if (!this.myName) this.myName = d.fields?.name?.stringValue || '';
    } catch (e) {}
  },
  async save() {
    if (!this.online || this.myBest <= 0) return;
    const mask = ['name', 'best', 'at'].map(f => '&updateMask.fieldPaths=' + f).join('');
    try {
      const r = await fetch(this.url('/scores/' + this.me, mask), {
        method: 'PATCH', headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ fields: {
          name: { stringValue: this.myName || 'Anonymní mimčo' },
          best: { integerValue: String(this.myBest) },
          at: { timestampValue: new Date().toISOString() } } })
      });
      if (!r.ok) throw new Error(r.status);
      this.hasDoc = true;
      this.status('Uloženo do žebříčku.');
      this.refresh();
    } catch (e) { this.status('Skóre se nepodařilo uložit.'); }
  },
  askName() {
    this.inputEl.value = this.myName;
    this.modal.hidden = false;
    this.named = false;
    setTimeout(() => { this.inputEl.focus(); this.inputEl.select(); }, 50);
  },
  async init() {
    this.me = this.ls('batole_id');
    if (!this.me) {
      this.me = (crypto.randomUUID ? crypto.randomUUID() : 'd' + Date.now() + String(Math.random()).slice(2, 10)).replace(/[^a-zA-Z0-9-]/g, '');
      this.ls('batole_id', this.me);
    }
    this.myName = this.ls('batole_name') || '';
    this.myBest = +(this.ls('batole_best') || 0);
    this.online = !!FIREBASE.projectId && !FIREBASE.projectId.startsWith('SEM_');
    this.formEl.addEventListener('submit', ev => {
      ev.preventDefault();
      const n = this.inputEl.value.trim().replace(/\s+/g, ' ').slice(0, 20);
      if (!n) return;
      const changed = n !== this.myName;
      this.myName = n; this.ls('batole_name', n);
      this.whoEl.textContent = n;
      this.modal.hidden = true;
      this.inputEl.blur();
      this.named = true;
      if (changed && this.myBest > 0) this.save();
    });
    document.getElementById('changeName').addEventListener('click', e => { e.currentTarget.blur(); this.askName(); });
    this.askName();
    if (!this.online) { this.empty('Žebříček zatím není nastavený (chybí údaje Firebase). Hrát jde i tak.'); return; }
    await this.loadMine();
    if (this.myName && !this.inputEl.value) this.inputEl.value = this.myName;
    this.refresh();
    setInterval(() => {
      const st = window.game?.scene?.getScene('play')?.state;
      if (!document.hidden && st !== 'run') this.refresh();
    }, 60000);
  },
  submit(score) {
    if (score > this.myBest) { this.myBest = score; this.ls('batole_best', score); this.save(); }
  }
};

class Boot extends Phaser.Scene {
  constructor() { super('boot'); }
  create() {
    for (const [k, img] of Object.entries(window.__imgs)) this.textures.addImage(k, img);
    document.getElementById('loading').remove();
    this.scene.start('play');
  }
}

(async () => {
  const entries = await Promise.all(Object.entries(ASSETS).map(async ([k, u]) => [k, await loadImg(u)]));
  window.__imgs = Object.fromEntries(entries);
  const CZ = 'ÁáČčĎďÉéĚěÍíŇňÓóŘřŠšŤťÚúŮůÝýŽž·×…';
  try {
    await Promise.all([
      document.fonts.load("800 40px 'Baloo 2'", 'Batole ' + CZ),
      document.fonts.load("600 40px 'Baloo 2'", 'Batole ' + CZ),
    ]);
  } catch (e) {}
  Board.init();
  Audio.init();
  window.game = new Phaser.Game({
    type: Phaser.AUTO,
    parent: 'game',
    width: W, height: H,
    backgroundColor: '#1f1a24',
    scale: { mode: Phaser.Scale.FIT, autoCenter: Phaser.Scale.CENTER_BOTH },
    input: { keyboard: { capture: [] } },
    render: { antialias: true, roundPixels: false },
    scene: [Boot, Play],
  });
})();
